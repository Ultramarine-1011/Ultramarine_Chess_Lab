[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucl-lab"
version = "0.1.0"
description = "Reproducible experiment tools for Ultramarine Chess Lab"
requires-python = ">=3.11"
dependencies = ["chess==1.11.2", "jsonschema==4.25.1"]

[project.scripts]
ucl-lab = "ucl.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
