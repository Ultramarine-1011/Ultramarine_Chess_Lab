[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucl-lab"
version = "0.1.0"
description = "Reproducible experiment tools for Ultramarine Chess Lab"
requires-python = ">=3.12"
dependencies = ["chess==1.11.2", "jsonschema==4.25.1", "zstandard==0.25.0", "numpy==2.5.4", "scipy==1.18.1"]

[project.scripts]
ucl-lab = "ucl.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
ucl = ["web/*.html", "web/*.css", "web/*.js", "web/vendor/cm-chessboard/LICENSE",
       "web/vendor/cm-chessboard/src/*.js", "web/vendor/cm-chessboard/src/lib/*.js",
       "web/vendor/cm-chessboard/src/model/*.js", "web/vendor/cm-chessboard/src/view/*.js",
       "web/vendor/cm-chessboard/src/extensions/markers/*.js",
       "web/vendor/cm-chessboard/src/extensions/promotion-dialog/*.js",
       "web/vendor/cm-chessboard/assets/*.css", "web/vendor/cm-chessboard/assets/pieces/*.svg",
       "web/vendor/cm-chessboard/assets/extensions/markers/*",
       "web/vendor/cm-chessboard/assets/extensions/promotion-dialog/*.css"]
